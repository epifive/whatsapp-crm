# Nginx in front of CRM for WhatsApp (port 3000). Replace crm.example.com, then get HTTPS:
#   sudo certbot --nginx -d crm.example.com
server {
    listen 80;
    server_name crm.example.com;

    # Media uploads (campaign images, documents, contact imports)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Realtime inbox (Socket.IO websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
